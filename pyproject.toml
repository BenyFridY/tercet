[project]
name = "mesa"
version = "0.0.1"
description = "O livro da compra feita por agente — v0 (FDS 1: o livro fecha com dado sujo na Base Sepolia)"
requires-python = ">=3.11"
dependencies = [
    "x402[fastapi,httpx,evm]==2.20.0",
    "psycopg[binary]>=3.2",
    "web3>=7.6",
    "eth-account>=0.13",
    "pydantic-settings>=2.6",
    "rich>=13.9",
    "mcp>=2.0.0",
    "openinference-instrumentation-mcp>=2.0.6",
    "opentelemetry-sdk>=1.44.0",
    "anthropic>=1.0.0",
    "rfc8785>=0.1.4",
    "rfc3161ng>=2.1.3",
    "opentimestamps-client>=0.7.2",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "python-bcb>=0.4.0",
    "nfelib>=2.5.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mesa"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["web3.*", "eth_account.*", "x402.*", "eth_utils.*", "eth_typing.*",
          "rfc3161ng.*", "opentimestamps.*", "pyasn1.*", "pyasn1_modules.*",
          "bcb.*", "nfelib.*", "pandas.*", "lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
